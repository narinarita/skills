name: skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate SKILL.md frontmatter and README
        run: python3 scripts/validate_skills.py
      - name: Test check.py with fixtures
        run: python3 scripts/test_checks.py
